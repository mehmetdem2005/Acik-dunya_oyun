name: Build Production Dragon Asset

on:
  push:
    branches:
      - feat/aaa-dragon-blender
    paths:
      - "tools/dragon_production/**"
      - "tools/bootstrap/dragon_production_sources.tar.gz.b64.part*"
      - "assets/characters/dragon/*.gd"
      - "assets/characters/dragon/*.tscn"
      - "assets/characters/dragon/README.md"
      - ".github/workflows/build_dragon_asset.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/dragon_production/**"
      - "tools/bootstrap/dragon_production_sources.tar.gz.b64.part*"
      - "assets/characters/dragon/*.gd"
      - "assets/characters/dragon/*.tscn"
      - "assets/characters/dragon/README.md"
      - ".github/workflows/build_dragon_asset.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dragon-production-${{ github.ref }}
  cancel-in-progress: false

env:
  BLENDER_VERSION: "4.5.12"
  BLENDER_ARCHIVE: "blender-4.5.12-linux-x64.tar.xz"
  ASSET_OUTPUT: "assets/characters/dragon"

jobs:
  build-dragon:
    name: Generate, validate and commit dragon
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap production sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path

          expected = "8eb9c8615e691635d6e378ce25693da19014dd736a0e2efafb6698eb5398be1d"
          parts = sorted(Path("tools/bootstrap").glob("dragon_production_sources.tar.gz.b64.part*"))
          if len(parts) != 6:
              raise SystemExit(f"Expected 6 bootstrap parts, found {len(parts)}: {parts}")
          encoded = b"".join(part.read_bytes().strip() for part in parts)
          archive = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(archive).hexdigest()
          print(f"Bootstrap parts={len(parts)} encoded_bytes={len(encoded)} archive_bytes={len(archive)} sha256={actual}")
          if actual != expected:
              raise SystemExit(f"Bootstrap checksum mismatch: expected {expected}, got {actual}")
          Path("/tmp/dragon_production_sources.tar.gz").write_bytes(archive)
          PY
          gzip --test /tmp/dragon_production_sources.tar.gz
          tar -xzf /tmp/dragon_production_sources.tar.gz

      - name: Cache Blender LTS archive
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .cache/blender
          key: blender-${{ runner.os }}-${{ env.BLENDER_VERSION }}-x64

      - name: Download and verify Blender 4.5 LTS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/blender
          cd .cache/blender
          if [[ ! -f "${BLENDER_ARCHIVE}" ]]; then
            curl --fail --location --retry 5 --retry-delay 4 \
              "https://download.blender.org/release/Blender4.5/${BLENDER_ARCHIVE}" \
              --output "${BLENDER_ARCHIVE}"
          fi
          curl --fail --location --retry 5 --retry-delay 4 \
            "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}.sha256" \
            --output "blender-${BLENDER_VERSION}.sha256"
          grep "${BLENDER_ARCHIVE}" "blender-${BLENDER_VERSION}.sha256" | sha256sum --check --strict
          if [[ ! -x "blender-${BLENDER_VERSION}-linux-x64/blender" ]]; then
            tar -xf "${BLENDER_ARCHIVE}"
          fi

      - name: Generate production asset in Blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER="${GITHUB_WORKSPACE}/.cache/blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          rm -f "${ASSET_OUTPUT}/dragon_build_failure.json"
          "${BLENDER}" --background --factory-startup \
            --python tools/dragon_production/generate_dragon.py -- \
            --output "${ASSET_OUTPUT}" \
            --texture-size 1024 \
            --preview-size 768

      - name: Reopen blend and run independent QA
        shell: bash
        run: |
          set -euo pipefail
          BLENDER="${GITHUB_WORKSPACE}/.cache/blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          "${BLENDER}" --background "${ASSET_OUTPUT}/dragon_master.blend" \
            --python tools/dragon_production/validate_dragon.py -- \
            --output "${ASSET_OUTPUT}"

      - name: Verify glTF payloads
        shell: bash
        run: |
          set -euo pipefail
          test -s "${ASSET_OUTPUT}/dragon_master.glb"
          test -s "${ASSET_OUTPUT}/dragon_master.gltf"
          test -s "${ASSET_OUTPUT}/dragon_master.bin"
          test -s "${ASSET_OUTPUT}/dragon_master.blend"
          test -s "${ASSET_OUTPUT}/dragon_qa_report.json"
          test -s "${ASSET_OUTPUT}/dragon_qa_reopen_report.json"
          python -m json.tool "${ASSET_OUTPUT}/dragon_asset_manifest.json" >/dev/null
          python -m json.tool "${ASSET_OUTPUT}/dragon_qa_report.json" >/dev/null
          python -m json.tool "${ASSET_OUTPUT}/dragon_qa_reopen_report.json" >/dev/null

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          rm -f dragon-production-deliverables.zip
          zip -r -9 dragon-production-deliverables.zip "${ASSET_OUTPUT}" \
            -x "${ASSET_OUTPUT}/*.import"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-production-deliverables
          path: dragon-production-deliverables.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Commit generated source and binary asset
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/dragon_production assets/characters/dragon
          if git diff --cached --quiet; then
            echo "Generated asset is unchanged."
            exit 0
          fi
          git commit -m "build: generate rigged production dragon asset [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
